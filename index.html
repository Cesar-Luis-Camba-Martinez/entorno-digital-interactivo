<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ecuación Polinómica de Cuarto Grado</title>
  <!-- Cargamos MathJax para renderizado matemático elegante -->
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 20px; max-width: 600px; }
    .input-group { margin-bottom: 10px; }
    label { font-weight: bold; }
    input[type="number"] { width: 60px; padding: 5px; margin: 0 5px; }
    button { background-color: #007bff; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .result { margin-top: 15px; padding: 10px; background-color: #f8f9fa; border-left: 4px solid #007bff; }
  </style>
</head>
<body>

<div class="card">
  <h2>Ecuación Polinómica de Cuarto Grado</h2>
  
  <!-- Expresión matemática renderizada -->
  <p>Forma general: \[ ax^4 + bx^3 + cx^2 + dx + e = 0 \]</p>

  <div class="input-group">
    <label>Coeficientes:</label><br>
    \(a\) = <input type="number" id="coefA" value="1">
    \(b\) = <input type="number" id="coefB" value="0">
    \(c\) = <input type="number" id="coefC" value="-5">
    \(d\) = <input type="number" id="coefD" value="0">
    \(e\) = <input type="number" id="coefE" value="4">
  </div>

  <button onclick="evaluarPolinomio()">Evaluar en $x$</button>

  <div class="input-group" style="margin-top: 10px;">
    <label>Evaluar para \(x\) = </label>
    <input type="number" id="valX" value="2">
  </div>

  <div id="salida" class="result">
    Resultado de \(P(x)\): <strong>0</strong>
  </div>
</div>

<script>
  function evaluarPolinomio() {
    const a = parseFloat(document.getElementById('coefA').value) || 0;
    const b = parseFloat(document.getElementById('coefB').value) || 0;
    const c = parseFloat(document.getElementById('coefC').value) || 0;
    const d = parseFloat(document.getElementById('coefD').value) || 0;
    const e = parseFloat(document.getElementById('coefE').value) || 0;
    const x = parseFloat(document.getElementById('valX').value) || 0;

    // Evaluación mediante el algoritmo del polinomio de grado 4
    const resultado = a * Math.pow(x, 4) + b * Math.pow(x, 3) + c * Math.pow(x, 2) + d * x + e;

    document.getElementById('salida').innerHTML = 
      `Para \(x = ${x}\), el valor de \(P(${x})\) es: <strong>${resultado}</strong>`;
    
    // Reprocesar MathJax para refrescar la notación si cambia
    if (window.MathJax) {
      MathJax.typesetPromise();
    }
  }
</script>

</body>
</html>
